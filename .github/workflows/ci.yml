name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install Checkov in its own virtualenv (for the real IaC scan test)
        run: |
          python -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --quiet checkov==3.3.29
          echo "AGENTSHIELD_CHECKOV_PATH=$RUNNER_TEMP/checkov/bin/checkov" >> "$GITHUB_ENV"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Tests (no real AWS or LLM calls)
        run: pytest --cov=agentshield --cov-report=term-missing
      - name: Security regression - gateway, scenarios, redaction
        run: pytest tests/test_gateway.py tests/test_redteam.py tests/test_redaction.py -q
      - name: Dependency audit
        run: pip-audit --skip-editable
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t agentshield-api .
      - name: Build dashboard image
        run: docker build -t agentshield-web frontend
      - name: Smoke-test API image
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 agentshield-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/iac/scanner | grep '"available":true'
          curl -fsS -X POST http://127.0.0.1:8000/api/iac/demo | grep '"fixed"'
          docker rm -f api
