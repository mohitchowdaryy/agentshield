[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Open-source AI agent security and cloud posture research platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AgentShield contributors" }]
dependencies = [
  "fastapi==0.146.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "SQLAlchemy==2.1.5",
  "alembic==1.20.0",
  "typer==0.27.3",
  "rich==15.0.0",
  "boto3==1.43.114",
  "botocore==1.43.114",
  "httpx==0.28.1",
]

[project.optional-dependencies]
anthropic = ["anthropic==1.15.0"]
dev = [
  "anthropic==1.15.0",
  "moto[s3,iam,sts,cloudtrail]==5.2.4",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pip-audit",
]

[project.scripts]
agentshield = "agentshield.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentshield = ["data/**/*", "migrations/**/*", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
